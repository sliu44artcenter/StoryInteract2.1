<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Scholar's Choice - Interactive 3D Story</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
      background: #0a0a0a;
      touch-action: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 24px;
      z-index: 100;
      text-align: center;
      pointer-events: none;
    }

    #loading.hidden {
      display: none;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid #ffffff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #restart-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    #restart-button.visible {
      opacity: 1;
      pointer-events: all;
    }

    #restart-button:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateX(-50%) scale(1.05);
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading Story...</div>
  </div>

  <div id="canvas-container"></div>

  <button id="restart-button">Restart Story</button>

  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- GSAP from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    // ========================================
    // MAIN APPLICATION
    // ========================================

    let scene, camera, renderer;
    let snowParticles;
    let scholar, ground, sky;
    let choiceObjects = [];
    let stoneHouses, woodHouses, strawHuts;
    let ambientLight, directionalLight, secondaryLight;
    let isAnimating = false;
    let choiceSelected = null;
    let time = 0;

    const restartButton = document.getElementById('restart-button');
    const loading = document.getElementById('loading');

    // ========================================
    // INITIALIZATION
    // ========================================

    function init() {
      // Create scene
      scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0xb8d4e8, 10, 50);

      // Create camera
      camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 8, 15);
      camera.lookAt(0, 2, 0);

      // Create renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // Lighting
      ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(10, 20, 10);
      directionalLight.castShadow = true;
      directionalLight.shadow.mapSize.width = 2048;
      directionalLight.shadow.mapSize.height = 2048;
      directionalLight.shadow.camera.far = 50;
      directionalLight.shadow.camera.left = -20;
      directionalLight.shadow.camera.right = 20;
      directionalLight.shadow.camera.top = 20;
      directionalLight.shadow.camera.bottom = -20;
      scene.add(directionalLight);

      secondaryLight = new THREE.DirectionalLight(0xb3d9ff, 0.3);
      secondaryLight.position.set(-5, 10, -5);
      scene.add(secondaryLight);

      const pointLight = new THREE.PointLight(0xe6f2ff, 0.5);
      pointLight.position.set(0, 5, 8);
      scene.add(pointLight);

      // Create environment
      createSky();
      createGround();
      createSnow();
      createScholar();
      createChoices();

      // Create houses (initially hidden)
      createStoneHouses();
      createWoodHouses();
      createStrawHuts();

      // Event listeners
      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('click', onCanvasClick);
      renderer.domElement.addEventListener('touchend', onCanvasClick);
      restartButton.addEventListener('click', restartStory);

      // Hide loading
      loading.classList.add('hidden');

      // Start animation loop
      animate();
    }

    // ========================================
    // ENVIRONMENT CREATION
    // ========================================

    function createSky() {
      const skyGeometry = new THREE.SphereGeometry(100, 32, 32);
      const skyMaterial = new THREE.MeshBasicMaterial({
        color: 0xb8d4e8,
        side: THREE.BackSide
      });
      sky = new THREE.Mesh(skyGeometry, skyMaterial);
      scene.add(sky);
    }

    function createGround() {
      const groundGeometry = new THREE.PlaneGeometry(100, 100);
      const groundMaterial = new THREE.MeshStandardMaterial({
        color: 0xf0f8ff,
        roughness: 0.9,
        metalness: 0.1
      });
      ground = new THREE.Mesh(groundGeometry, groundMaterial);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);
    }

    function createSnow() {
      const particleCount = 2000;
      const positions = new Float32Array(particleCount * 3);
      const velocities = [];

      for (let i = 0; i < particleCount; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 100;
        positions[i * 3 + 1] = Math.random() * 50;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 100;

        velocities.push({
          x: (Math.random() - 0.5) * 0.02,
          y: -0.05 - Math.random() * 0.05,
          z: (Math.random() - 0.5) * 0.02
        });
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const material = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.15,
        transparent: true,
        opacity: 0.8
      });

      snowParticles = new THREE.Points(geometry, material);
      snowParticles.velocities = velocities;
      scene.add(snowParticles);
    }

    function createScholar() {
      const group = new THREE.Group();

      // Body
      const bodyGeometry = new THREE.CylinderGeometry(0.4, 0.5, 1.5, 8);
      const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
      const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
      body.castShadow = true;
      body.position.y = 0.75;
      group.add(body);

      // Head
      const headGeometry = new THREE.SphereGeometry(0.35, 16, 16);
      const headMaterial = new THREE.MeshStandardMaterial({ color: 0xffd5a3 });
      const head = new THREE.Mesh(headGeometry, headMaterial);
      head.castShadow = true;
      head.position.y = 1.8;
      group.add(head);

      // Hat
      const hatGeometry = new THREE.ConeGeometry(0.5, 0.4, 8);
      const hatMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
      const hat = new THREE.Mesh(hatGeometry, hatMaterial);
      hat.castShadow = true;
      hat.position.y = 2.3;
      group.add(hat);

      group.position.set(0, 0, 0);
      scholar = group;
      scene.add(group);
    }

    function createChoices() {
      const materials = [
        { color: 0x808080, name: 'stone', icon: '🪨' },   // Grey for stone
        { color: 0x8b4513, name: 'wood', icon: '🌲' },    // Brown for wood
        { color: 0xdaa520, name: 'straw', icon: '🌾' }    // Golden for straw
      ];

      materials.forEach((mat, index) => {
        const group = new THREE.Group();

        // Main icon shape
        const geometry = new THREE.DodecahedronGeometry(0.6, 0);
        const material = new THREE.MeshStandardMaterial({
          color: mat.color,
          emissive: mat.color,
          emissiveIntensity: 0.5,
          roughness: 0.3,
          metalness: 0.7
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = true;
        group.add(mesh);

        // Glow effect
        const glowGeometry = new THREE.SphereGeometry(0.8, 16, 16);
        const glowMaterial = new THREE.MeshBasicMaterial({
          color: mat.color,
          transparent: true,
          opacity: 0.2
        });
        const glow = new THREE.Mesh(glowGeometry, glowMaterial);
        group.add(glow);

        // Add point light
        const light = new THREE.PointLight(mat.color, 1, 5);
        group.add(light);

        // Position in arc
        const angle = (index - 1) * (Math.PI / 3);
        const radius = 4;
        group.position.set(
          Math.sin(angle) * radius,
          3,
          Math.cos(angle) * radius
        );

        group.userData.choice = mat.name;
        group.userData.originalY = 3;
        group.userData.angle = angle;
        group.userData.radius = radius;

        choiceObjects.push(group);
        scene.add(group);
      });
    }

    // ========================================
    // HOUSES CREATION
    // ========================================

    function createStoneHouses() {
      const group = new THREE.Group();

      const positions = [
        [-4, 0, -3],
        [-2, 0, -4],
        [2, 0, -3],
        [4, 0, -4],
        [-3, 0, 2],
        [3, 0, 2]
      ];

      positions.forEach(pos => {
        const house = new THREE.Group();

        // Stone body
        const bodyGeometry = new THREE.BoxGeometry(1.5, 1.8, 1.5);
        const bodyMaterial = new THREE.MeshStandardMaterial({
          color: 0x708090,
          roughness: 0.9,
          metalness: 0.1
        });
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.castShadow = true;
        body.receiveShadow = true;
        body.position.y = 0.9;
        house.add(body);

        // Stone roof
        const roofGeometry = new THREE.ConeGeometry(1.2, 1, 4);
        const roofMaterial = new THREE.MeshStandardMaterial({
          color: 0x556b2f,
          roughness: 0.8
        });
        const roof = new THREE.Mesh(roofGeometry, roofMaterial);
        roof.castShadow = true;
        roof.position.y = 2.3;
        roof.rotation.y = Math.PI / 4;
        house.add(roof);

        // Window
        const windowGeometry = new THREE.BoxGeometry(0.4, 0.4, 0.1);
        const windowMaterial = new THREE.MeshStandardMaterial({
          color: 0xffeb3b,
          emissive: 0xffeb3b,
          emissiveIntensity: 0
        });
        const window1 = new THREE.Mesh(windowGeometry, windowMaterial);
        window1.position.set(0, 1, 0.76);
        house.add(window1);

        // Window light
        const windowLight = new THREE.PointLight(0xffeb3b, 0, 3);
        windowLight.position.set(0, 1, 1);
        house.add(windowLight);

        house.position.set(pos[0], pos[1], pos[2]);
        group.add(house);
      });

      group.scale.set(0, 0, 0);
      stoneHouses = group;
      scene.add(group);
    }

    function createWoodHouses() {
      const group = new THREE.Group();

      const positions = [
        [-4, 0, -3],
        [-1, 0, -4],
        [2, 0, -3],
        [4, 0, -2],
        [-3, 0, 2],
        [3, 0, 2]
      ];

      positions.forEach(pos => {
        const house = new THREE.Group();

        // Wooden body
        const bodyGeometry = new THREE.BoxGeometry(1.4, 1.6, 1.4);
        const bodyMaterial = new THREE.MeshStandardMaterial({
          color: 0x8b4513,
          roughness: 0.8
        });
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.castShadow = true;
        body.receiveShadow = true;
        body.position.y = 0.8;
        house.add(body);

        // Wooden roof
        const roofGeometry = new THREE.ConeGeometry(1.1, 0.9, 4);
        const roofMaterial = new THREE.MeshStandardMaterial({
          color: 0x654321,
          roughness: 0.9
        });
        const roof = new THREE.Mesh(roofGeometry, roofMaterial);
        roof.castShadow = true;
        roof.position.y = 2.05;
        roof.rotation.y = Math.PI / 4;
        house.add(roof);

        house.position.set(pos[0], pos[1], pos[2]);
        group.add(house);
      });

      // Fire light (starts off)
      const fireLight = new THREE.PointLight(0xff4500, 0, 10);
      fireLight.position.set(0, 2, 0);
      group.add(fireLight);

      group.scale.set(0, 0, 0);
      woodHouses = group;
      scene.add(group);
    }

    function createStrawHuts() {
      const group = new THREE.Group();

      const positions = [
        [-3.5, 0, -2.5],
        [-1, 0, -3],
        [2, 0, -2.5],
        [3.5, 0, -3],
        [-2.5, 0, 2],
        [2.5, 0, 2]
      ];

      positions.forEach(pos => {
        const hut = new THREE.Group();

        // Straw body
        const bodyGeometry = new THREE.CylinderGeometry(0.7, 0.8, 1.2, 8);
        const bodyMaterial = new THREE.MeshStandardMaterial({
          color: 0xdaa520,
          roughness: 0.9
        });
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.castShadow = true;
        body.receiveShadow = true;
        body.position.y = 0.6;
        hut.add(body);

        // Straw roof
        const roofGeometry = new THREE.ConeGeometry(1, 0.8, 8);
        const roofMaterial = new THREE.MeshStandardMaterial({
          color: 0xb8860b,
          roughness: 1
        });
        const roof = new THREE.Mesh(roofGeometry, roofMaterial);
        roof.castShadow = true;
        roof.position.y = 1.6;
        hut.add(roof);

        hut.position.set(pos[0], pos[1], pos[2]);
        group.add(hut);
      });

      group.scale.set(0, 0, 0);
      strawHuts = group;
      scene.add(group);
    }

    // ========================================
    // INTERACTION
    // ========================================

    function onCanvasClick(event) {
      if (isAnimating || choiceSelected) return;

      event.preventDefault();

      const mouse = new THREE.Vector2();

      if (event.type === 'touchend' && event.changedTouches) {
        const touch = event.changedTouches[0];
        mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
      } else {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      }

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(
        choiceObjects.map(obj => obj.children[0]),
        false
      );

      if (intersects.length > 0) {
        const clickedObject = intersects[0].object.parent;
        const choice = clickedObject.userData.choice;
        handleChoice(choice, clickedObject);
      }
    }

    function handleChoice(choice, clickedObject) {
      choiceSelected = choice;
      isAnimating = true;

      // Animate selected choice
      gsap.to(clickedObject.scale, {
        x: 1.5, y: 1.5, z: 1.5,
        duration: 0.5,
        ease: 'back.out(1.7)'
      });

      // Fade out other choices
      choiceObjects.forEach(obj => {
        if (obj !== clickedObject) {
          gsap.to(obj.scale, {
            x: 0, y: 0, z: 0,
            duration: 0.5,
            ease: 'power2.in'
          });
        }
      });

      // Remove selected choice after delay
      gsap.to(clickedObject.scale, {
        x: 0, y: 0, z: 0,
        duration: 0.5,
        delay: 1,
        ease: 'power2.in',
        onComplete: () => {
          triggerEnding(choice);
        }
      });
    }

    function triggerEnding(choice) {
      if (choice === 'stone') {
        animateStoneEnding();
      } else if (choice === 'wood') {
        animateWoodEnding();
      } else if (choice === 'straw') {
        animateStrawEnding();
      }
    }

    // ========================================
    // ENDING ANIMATIONS
    // ========================================

    function animateStoneEnding() {
      const tl = gsap.timeline({
        onComplete: () => {
          restartButton.classList.add('visible');
          isAnimating = false;
        }
      });

      // Phase 1: Stone houses rise
      tl.to(stoneHouses.scale, {
        x: 1, y: 1, z: 1,
        duration: 2.5,
        ease: 'back.out(1.2)'
      });

      // Phase 2: Blizzard - sky darkens
      tl.to(sky.material.color, {
        r: 0.2, g: 0.25, b: 0.35,
        duration: 2
      }, 1.5);

      tl.to(scene.fog.color, {
        r: 0.3, g: 0.35, b: 0.45,
        duration: 2
      }, 1.5);

      // Phase 3: Windows light up
      stoneHouses.children.forEach((house, i) => {
        const windowLight = house.children.find(child => child.isPointLight);
        const windowMesh = house.children.find(child =>
          child.isMesh && child.geometry.parameters && child.geometry.parameters.width === 0.4
        );

        if (windowLight) {
          tl.to(windowLight, {
            intensity: 3.5,
            duration: 1.5,
            ease: 'power2.out'
          }, 4 + i * 0.2);
        }

        if (windowMesh && windowMesh.material) {
          tl.to(windowMesh.material, {
            emissiveIntensity: 2.5,
            duration: 1.5,
            ease: 'power2.out'
          }, 4 + i * 0.2);
        }
      });

      // Phase 4: Golden sunlight
      tl.to(directionalLight, {
        intensity: 1.5,
        duration: 3,
        ease: 'power2.inOut'
      }, 6);

      tl.to(directionalLight.color, {
        r: 1.0, g: 0.9, b: 0.7,
        duration: 3
      }, 6);

      tl.to(sky.material.color, {
        r: 0.95, g: 0.8, b: 0.6,
        duration: 3
      }, 6);

      tl.to(scene.fog.color, {
        r: 0.95, g: 0.85, b: 0.7,
        duration: 3
      }, 6);

      // Camera movement
      tl.to(camera.position, {
        y: camera.position.y + 3,
        duration: 9,
        ease: 'power1.inOut'
      }, 0);
    }

    function animateWoodEnding() {
      const tl = gsap.timeline({
        onComplete: () => {
          restartButton.classList.add('visible');
          isAnimating = false;
        }
      });

      // Phase 1: Wooden houses appear
      tl.to(woodHouses.scale, {
        x: 1, y: 1, z: 1,
        duration: 2.5,
        ease: 'back.out(1.2)'
      });

      // Phase 2: Night falls
      tl.to(sky.material.color, {
        r: 0.05, g: 0.05, b: 0.1,
        duration: 2.5
      }, 2);

      tl.to(ambientLight, {
        intensity: 0.15,
        duration: 2.5
      }, 2);

      tl.to(scene.fog.color, {
        r: 0.1, g: 0.1, b: 0.15,
        duration: 2.5
      }, 2);

      // Phase 3: Fire starts
      const fireLight = woodHouses.children.find(child => child.isPointLight);
      if (fireLight) {
        tl.to(fireLight, {
          intensity: 1.5,
          duration: 1,
          ease: 'power2.in'
        }, 4.5);

        // Flickering
        tl.to(fireLight, {
          intensity: 2.5,
          duration: 0.1,
          repeat: 10,
          yoyo: true
        }, 5.5);

        // Fire spreads
        tl.to(fireLight, {
          intensity: 6.0,
          distance: 15,
          duration: 2,
          ease: 'power2.out'
        }, 6.5);
      }

      // Phase 4: Houses burn black
      woodHouses.children.forEach((house, i) => {
        if (house.isGroup) {
          const bodyMesh = house.children.find(child =>
            child.isMesh && child.geometry.type === 'BoxGeometry'
          );
          const roofMesh = house.children.find(child =>
            child.isMesh && child.geometry.type === 'ConeGeometry'
          );

          if (bodyMesh && bodyMesh.material) {
            tl.to(bodyMesh.material.color, {
              r: 0.1, g: 0.08, b: 0.05,
              duration: 2,
              ease: 'power2.in'
            }, 7 + i * 0.3);
          }

          if (roofMesh && roofMesh.material) {
            tl.to(roofMesh.material.color, {
              r: 0.05, g: 0.03, b: 0.02,
              duration: 2,
              ease: 'power2.in'
            }, 7 + i * 0.3);
          }
        }
      });

      // Phase 5: Red smoke
      tl.to(sky.material.color, {
        r: 0.4, g: 0.1, b: 0.05,
        duration: 2.5
      }, 8);

      tl.to(scene.fog.color, {
        r: 0.5, g: 0.15, b: 0.1,
        duration: 2.5
      }, 8);

      // Camera movement
      tl.to(camera.position, {
        y: camera.position.y - 1,
        x: camera.position.x + 2,
        duration: 10,
        ease: 'power1.inOut'
      }, 0);
    }

    function animateStrawEnding() {
      const tl = gsap.timeline({
        onComplete: () => {
          restartButton.classList.add('visible');
          isAnimating = false;
        }
      });

      // Phase 1: Straw huts appear
      tl.to(strawHuts.scale, {
        x: 1, y: 1, z: 1,
        duration: 2.5,
        ease: 'back.out(1.2)'
      });

      // Phase 2: Storm intensifies
      tl.to(sky.material.color, {
        r: 0.6, g: 0.7, b: 0.85,
        duration: 2
      }, 2);

      tl.to(scene.fog.color, {
        r: 0.7, g: 0.75, b: 0.85,
        duration: 2
      }, 2);

      tl.to(ambientLight.color, {
        r: 0.7, g: 0.8, b: 1.0,
        duration: 2
      }, 2);

      // Phase 3: Huts wobble
      strawHuts.children.forEach((hut, i) => {
        tl.to(hut.rotation, {
          z: 0.15,
          duration: 0.3,
          yoyo: true,
          repeat: 5,
          ease: 'sine.inOut'
        }, 4 + i * 0.1);
      });

      // Phase 4: Huts collapse
      strawHuts.children.forEach((hut, i) => {
        tl.to(hut.scale, {
          y: 0.2,
          duration: 1.2,
          ease: 'power3.in'
        }, 6.5 + i * 0.3);

        tl.to(hut.rotation, {
          x: Math.PI / 4 + (Math.random() - 0.5) * 0.5,
          z: Math.PI / 6 + (Math.random() - 0.5) * 0.3,
          duration: 1.2,
          ease: 'power3.in'
        }, 6.5 + i * 0.3);

        tl.to(hut.position, {
          y: -0.5,
          duration: 1.2,
          ease: 'bounce.out'
        }, 6.5 + i * 0.3);
      });

      // Phase 5: Heavy fog
      tl.to(scene.fog.color, {
        r: 0.85, g: 0.9, b: 0.98,
        duration: 2.5
      }, 8);

      tl.to(sky.material.color, {
        r: 0.75, g: 0.8, b: 0.9,
        duration: 2.5
      }, 8);

      // Camera movement
      tl.to(camera.position, {
        x: camera.position.x - 3,
        z: camera.position.z + 4,
        y: camera.position.y + 1,
        duration: 10,
        ease: 'power1.out'
      }, 0);
    }

    // ========================================
    // RESTART FUNCTIONALITY
    // ========================================

    function restartStory() {
      restartButton.classList.remove('visible');

      // Reset all variables
      choiceSelected = null;
      isAnimating = false;
      time = 0;

      // Reset camera
      gsap.to(camera.position, {
        x: 0, y: 8, z: 15,
        duration: 1,
        onUpdate: () => camera.lookAt(0, 2, 0)
      });

      // Reset sky and lighting
      gsap.to(sky.material.color, { r: 0.72, g: 0.83, b: 0.91, duration: 1 });
      gsap.to(scene.fog.color, { r: 0.72, g: 0.83, b: 0.91, duration: 1 });
      gsap.to(ambientLight, { intensity: 0.4, duration: 1 });
      gsap.to(ambientLight.color, { r: 1, g: 1, b: 1, duration: 1 });
      gsap.to(directionalLight, { intensity: 0.8, duration: 1 });
      gsap.to(directionalLight.color, { r: 1, g: 1, b: 1, duration: 1 });

      // Hide all houses
      gsap.to(stoneHouses.scale, { x: 0, y: 0, z: 0, duration: 0.5 });
      gsap.to(woodHouses.scale, { x: 0, y: 0, z: 0, duration: 0.5 });
      gsap.to(strawHuts.scale, { x: 0, y: 0, z: 0, duration: 0.5 });

      // Reset house materials
      stoneHouses.children.forEach(house => {
        house.children.forEach(child => {
          if (child.isPointLight) {
            gsap.to(child, { intensity: 0, duration: 0.5 });
          }
          if (child.isMesh && child.material) {
            gsap.to(child.material, { emissiveIntensity: 0, duration: 0.5 });
          }
        });
      });

      woodHouses.children.forEach(house => {
        if (house.isPointLight) {
          gsap.to(house, { intensity: 0, distance: 10, duration: 0.5 });
        }
        if (house.isGroup) {
          house.children.forEach(child => {
            if (child.isMesh && child.material && child.geometry.type === 'BoxGeometry') {
              gsap.to(child.material.color, { r: 0.545, g: 0.271, b: 0.075, duration: 0.5 });
            }
            if (child.isMesh && child.material && child.geometry.type === 'ConeGeometry') {
              gsap.to(child.material.color, { r: 0.396, g: 0.263, b: 0.129, duration: 0.5 });
            }
          });
        }
      });

      strawHuts.children.forEach(hut => {
        gsap.to(hut.scale, { x: 1, y: 1, z: 1, duration: 0.5 });
        gsap.to(hut.rotation, { x: 0, z: 0, duration: 0.5 });
        gsap.to(hut.position, { y: 0, duration: 0.5 });
      });

      // Show choices again
      choiceObjects.forEach((obj, index) => {
        gsap.to(obj.scale, {
          x: 1, y: 1, z: 1,
          duration: 0.8,
          delay: 0.5,
          ease: 'back.out(1.7)'
        });
      });
    }

    // ========================================
    // ANIMATION LOOP
    // ========================================

    function animate() {
      requestAnimationFrame(animate);

      time += 0.016;

      // Update snow particles
      if (snowParticles) {
        const positions = snowParticles.geometry.attributes.position.array;

        for (let i = 0; i < snowParticles.velocities.length; i++) {
          const vel = snowParticles.velocities[i];

          positions[i * 3] += vel.x;
          positions[i * 3 + 1] += vel.y;
          positions[i * 3 + 2] += vel.z;

          // Reset particles that fall below ground
          if (positions[i * 3 + 1] < 0) {
            positions[i * 3 + 1] = 50;
            positions[i * 3] = (Math.random() - 0.5) * 100;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
          }
        }

        snowParticles.geometry.attributes.position.needsUpdate = true;
      }

      // Animate choice objects
      if (!isAnimating && !choiceSelected) {
        choiceObjects.forEach((obj, index) => {
          // Orbit rotation
          const orbitSpeed = 0.3;
          obj.userData.angle += 0.003 * orbitSpeed;
          obj.position.x = Math.sin(obj.userData.angle) * obj.userData.radius;
          obj.position.z = Math.cos(obj.userData.angle) * obj.userData.radius;

          // Float up and down
          obj.position.y = obj.userData.originalY + Math.sin(time * 2 + index) * 0.3;

          // Rotate
          obj.rotation.y += 0.01;
          obj.rotation.x = Math.sin(time + index) * 0.1;

          // Pulse glow
          const glowMesh = obj.children[1];
          if (glowMesh) {
            glowMesh.material.opacity = 0.2 + Math.sin(time * 3 + index) * 0.1;
          }
        });
      }

      // Camera orbit (when not animating)
      if (!isAnimating && !choiceSelected) {
        const radius = 15;
        camera.position.x = Math.sin(time * 0.15) * radius;
        camera.position.z = Math.cos(time * 0.15) * radius;
        camera.lookAt(0, 2, 0);
      }

      renderer.render(scene, camera);
    }

    // ========================================
    // WINDOW RESIZE
    // ========================================

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ========================================
    // START APPLICATION
    // ========================================

    window.addEventListener('load', init);
  </script>
</body>
</html>
